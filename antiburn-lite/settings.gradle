        mavenCentral()
        maven { url 'https://jitpack.io' }  // Miuix 组件库
        maven { url 'https://api.xposed.info/' }  // LSPosed/Xposed API (compileOnly)
    }
}
rootProject.name = "antiburn-lite"
include ':app'
